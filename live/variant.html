<!DOCTYPE html>
<html lang="hy">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Հայկական TV - Ուղիղ Եթեր</title>
  <link href="https://vjs.zencdn.net/8.10.0/video-js.css" rel="stylesheet" />
  
  <style>
    :root {
      --bg-color: #0c0c0c;
      --panel-color: #1a1a1a;
      --accent-color: #ff3e3e;
      /* Կարմիր շեշտադրում */
      --text-color: #ffffff;
      --text-secondary: #aaaaaa;
    }
    
    * {
      box-sizing: border-box;
      -webkit-tap-highlight-color: transparent;
    }
    
    body {
      margin: 0;
      padding: 0;
      font-family: 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
      background-color: var(--bg-color);
      color: var(--text-color);
      display: flex;
      flex-direction: column;
      height: 100vh;
      overflow: hidden;
    }
    
    /* ----- Փլեյերի հատվածը (Վերևում, ֆիքսված) ----- */
    #player-wrapper {
      width: 100%;
      background-color: #000;
      position: relative;
      /* Ֆիքսված 16:9 հարաբերակցություն փլեյերի համար */
      padding-top: 56.25%;
    }
    
    #my-video {
      position: absolute;
      top: 0;
      left: 0;
      width: 100% !important;
      height: 100% !important;
    }
    
    /* Վերնագիրը փլեյերի տակ */
    #active-channel-info {
      padding: 10px 15px;
      background-color: var(--panel-color);
      border-bottom: 1px solid #333;
    }
    
    #active-channel-name {
      margin: 0;
      font-size: 1.1em;
      font-weight: 600;
    }
    
    /* ----- Ալիքների ցանկը (Ներքևում, սքրոլով) ----- */
    #playlist-wrapper {
      flex-grow: 1;
      overflow-y: auto;
      -webkit-overflow-scrolling: touch;
      /* Մեղմ սքրոլ iOS-ի համար */
    }
    
    #channel-list {
      list-style: none;
      margin: 0;
      padding: 0;
    }
    
    /* Խմբերի վերնագրերը */
    .group-header {
      padding: 12px 15px;
      background-color: #252525;
      font-size: 0.85em;
      text-transform: uppercase;
      letter-spacing: 1px;
      color: var(--text-secondary);
      font-weight: bold;
      border-bottom: 1px solid #333;
    }
    
    /* Ալիքի տողը */
    .channel-item {
      display: flex;
      align-items: center;
      padding: 15px;
      cursor: pointer;
      border-bottom: 1px solid #2a2a2a;
      transition: background 0.2s;
    }
    
    .channel-item:active {
      background-color: #2a2a2a;
    }
    
    .channel-item.active {
      background-color: rgba(255, 62, 62, 0.1);
      border-left: 4px solid var(--accent-color);
      padding-left: 11px;
      /* Փոխհատուցում border-ի համար */
    }
    
    .channel-icon {
      width: 30px;
      height: 30px;
      background-color: #333;
      border-radius: 5px;
      margin-right: 15px;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 0.8em;
      color: #555;
    }
    
    .channel-name {
      flex-grow: 1;
      font-size: 1em;
    }
    
    /* Հատուկ դիզայն ավելի մեծ էկրանների համար (օրինակ՝ պլանշետ, հորիզոնական դիրք) */
    @media (min-width: 768px) {
      body {
        flex-direction: row;
      }
      
      #player-wrapper {
        flex-grow: 1;
        height: 100vh;
        padding-top: 0;
        display: flex;
        flex-direction: column;
        justify-content: center;
      }
      
      #active-channel-info {
        position: absolute;
        bottom: 0;
        left: 0;
        width: 100%;
        background: rgba(0, 0, 0, 0.7);
      }
      
      #playlist-wrapper {
        width: 350px;
        height: 100vh;
        border-left: 1px solid #333;
      }
    }
  </style>
</head>

<body>
  
  <div id="player-wrapper">
    <video id="my-video" class="video-js vjs-big-play-centered vjs-theme-city" controls preload="auto">
      <p class="vjs-no-js">
        Տեսանյութը դիտելու համար միացրեք JavaScript-ը։
      </p>
    </video>
  </div>
  
  <div id="active-channel-info">
    <h2 id="active-channel-name">Ընտրեք ալիք...</h2>
  </div>
  
  <div id="playlist-wrapper">
    <ul id="channel-list">
    </ul>
  </div>
  
  <script src="https://vjs.zencdn.net/8.10.0/video.min.js"></script>
  
  <script>
    // --- ՀՏՏՊ հղումներին ավելացված է պրոքսի ---
    const channelsData = [
      // ՀԱՅԿԱԿԱՆ
      { group: "ՀԱՅԿԱԿԱՆ", name: "Armenia TV", url: "https://s80718.cdn.ngenix.net//hls//CH_ARMENIA_TV_HD//variant.m3u8" },
      { group: "ՀԱՅԿԱԿԱՆ", name: "ATV", url: "https://s70378.cdn.ngenix.net//atv//index.m3u8" },
      { group: "ՀԱՅԿԱԿԱՆ", name: "Kentron TV", url: "https://s70378.cdn.ngenix.net//kentron_tv//index.m3u8" },
      { group: "ՀԱՅԿԱԿԱՆ", name: "Lori TV", url: "https://s70378.cdn.ngenix.net/lori_tv//index.m3u8" },
      { group: "ՀԱՅԿԱԿԱՆ", name: "Delta TV", url: "https://s70378.cdn.ngenix.net//delta_tv//index.m3u8" },
      { group: "ՀԱՅԿԱԿԱՆ", name: "Tsayg TV", url: "https://s80718.cdn.ngenix.net//hls//CH_TSAYG_GYUMRI/variant.m3u8" },
      { group: "ՀԱՅԿԱԿԱՆ", name: "Hay TV", url: "https://s70378.cdn.ngenix.net//hay_tv//index.m3u8" },
      { group: "ՀԱՅԿԱԿԱՆ", name: "USArmenia", url: "https://cors-proxy.cooks.fyi/http://livestream.usatv.com/hls/master-iUSATVLIVENET.m3u8" },
      { group: "ՀԱՅԿԱԿԱՆ", name: "Nor Hayastan TV", url: "https://cdn.hayastantv.com:8088/nor-hayastan/tracks-v1a1/" },
      { group: "ՀԱՅԿԱԿԱՆ", name: "5 Aliq", url: "https://s80718.cdn.ngenix.net//hls//CH_ARARATHD//variant.m3u8" },
      { group: "ՀԱՅԿԱԿԱՆ", name: "ARTN Shant", url: "https://streamer1.connectto.com/ARTN_mobile/index.m3u8" },
      
      // ԼՐԱՏՎԱԿԱՆ
      { group: "ԼՐԱՏՎԱԿԱՆ", name: "Azatutyun TV", url: "https://s80718.cdn.ngenix.net/hls/CH_AZATUTYUN_TVHD/variant.m3u8" },
      { group: "ԼՐԱՏՎԱԿԱՆ", name: "EuroMedia 24", url: "https://s80718.cdn.ngenix.net/hls/CH_EUROMEDIA24HD/variant.m3u8" },
      { group: "ԼՐԱՏՎԱԿԱՆ", name: "FreeNews", url: "https://s70378.cdn.ngenix.net//freenews//index.m3u8" },
      { group: "ԼՐԱՏՎԱԿԱՆ", name: "Public TV News", url: "https://amtvusdvr.tulix.tv/am3abr/index.m3u8" },
      
      // SHANT
      { group: "SHANT", name: "Shant TV", url: "https://s80718.cdn.ngenix.net//hls//CH_SHANTHD//variant.m3u8" },
      { group: "SHANT", name: "Shant Gyumri", url: "https://s80718.cdn.ngenix.net//hls//CH_SHANT_GYUMRIHD//variant.m3u8" },
      { group: "SHANT", name: "Shant Premium", url: "https://s80718.cdn.ngenix.net//hls//CH_SHANT_PREMIUMHD//variant.m3u8" },
      { group: "SHANT", name: "Shant Serial", url: "https://s80718.cdn.ngenix.net//hls//CH_SHANT_SERIALHD//variant.m3u8" },
      
      // ՄԱՆԿԱԿԱՆ
      { group: "ՄԱՆԿԱԿԱՆ", name: "Shant Kids", url: "https://s80718.cdn.ngenix.net//hls//CH_SHANT_KIDSHD//variant.m3u8" },
      
      // ՍՊՈՐՏ
      { group: "ՍՊՈՐՏ", name: "Fast Sports", url: "https://s80718.cdn.ngenix.net//hls//CH_FAST_SPORTSHD//variant.m3u8" },
      { group: "ՍՊՈՐՏ", name: "Match TV", url: "https://bl.video.matchtv.ru/media/playlist/free_d46d0cf1712c0542ec7fd4f0808f600a_hd/17_89756005/1080/e6bef86de8a133cd7b27deb040758a00/4796141934.m3u8" },
      { group: "ՍՊՈՐՏ", name: "Match Football 1", url: "https://cors-proxy.cooks.fyi/http://31.148.48.15/Match_Futbol_1_HD/index.m3u8?token=test" },
      { group: "ՍՊՈՐՏ", name: "Match Football 2", url: "https://cors-proxy.cooks.fyi/http://31.148.48.15/Match_Futbol_2_HD/index.m3u8?token=test" },
      { group: "ՍՊՈՐՏ", name: "Match Football 3", url: "https://cors-proxy.cooks.fyi/http://31.148.48.15/Match_Futbol_3_HD/index.m3u8?token=test" },
      { group: "ՍՊՈՐՏ", name: "Match Igra", url: "https://cors-proxy.cooks.fyi/http://31.148.48.15/Match_Igra/index.m3u8?token=test" },
      { group: "ՍՊՈՐՏ", name: "Match Planeta", url: "https://cors-proxy.cooks.fyi/https://ncdn-y1-w6.teamcloud.am/live/eds/Match_Planeta/SAF-HLS/Match_Planeta.m3u8" },
      
      // ՖԻԼՄԵՐ
      { group: "ՖԻԼՄԵՐ", name: "Bazmoc", url: "https://s70378.cdn.ngenix.net//bazmoc//index.m3u8" },
      { group: "ՖԻԼՄԵՐ", name: "Kinoman", url: "https://s70378.cdn.ngenix.net//kinoman//index.m3u8" },
      
      // ԺԱՄԱՆՑ
      { group: "ԺԱՄԱՆՑ", name: "H2 TV", url: "https://s70378.cdn.ngenix.net//h2//index.m3u8" }
    ];
    
    // Փլեյերի նախաձեռնում
    var player = videojs('my-video', {
      controls: true,
      autoplay: false,
      preload: 'auto',
      fluid: true, // Պլաստիկ դիզայն
      responsive: true,
      userActions: {
        hotkeys: true // Թույլ տալ ստեղնաշարով կառավարում
      }
    });
    
    // Էլեմենտները
    const channelList = document.getElementById('channel-list');
    const activeChannelNameElement = document.getElementById('active-channel-name');
    
    // Պլեյլիստի ստեղծում
    let currentGroup = "";
    let listElements = [];
    
    channelsData.forEach((channel, index) => {
      // Ավելացնել խմբի վերնագիր, եթե այն փոխվել է
      if (channel.group !== currentGroup) {
        currentGroup = channel.group;
        const header = document.createElement('li');
        header.className = 'group-header';
        header.innerText = currentGroup;
        channelList.appendChild(header);
      }
      
      // Ավելացնել ալիքի տողը
      const li = document.createElement('li');
      li.className = 'channel-item';
      li.innerHTML = `
                <div class="channel-icon">${channel.name.substring(0, 1)}</div>
                <div class="channel-name">${channel.name}</div>
            `;
      
      // Կլիկի իրադարձություն
      li.addEventListener('click', function() {
        playChannel(index);
      });
      
      channelList.appendChild(li);
      listElements.push(li); // Պահել հղումը ստորև օգտագործելու համար
    });
    
    // Ալիքը նվագարկելու ֆունկցիա
    function playChannel(index) {
      const channel = channelsData[index];
      
      // Փոխել ակտիվ ալիքի անունը
      activeChannelNameElement.innerText = channel.name;
      
      // Փոխել հոսքի աղբյուրը
      player.src({
        src: channel.url,
        type: 'application/x-mpegURL' // HLS տեսակ
      });
      
      // Սկսել նվագարկումը
      player.ready(function() {
        player.play().catch(function(error) {
          // Ավտոմատ նվագարկումը երբեմն արգելափակվում է բրաուզերների կողմից
          console.log("Playback failed: ", error);
        });
      });
      
      // Նշել ակտիվ ալիքը ցանկում
      listElements.forEach(el => el.classList.remove('active'));
      listElements[index].classList.add('active');
      
      // Սքրոլ անել դեպի վերև (հեռախոսի համար)
      if (window.innerWidth < 768) {
        window.scrollTo({ top: 0, behavior: 'smooth' });
      }
    }
    
    // Ընտրել առաջին ալիքը լռելյայն
    playChannel(0);
  </script>
</body>

</html>
